name: FeatherX
options:
  bundleIdPrefix: com.risinginvader
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  RorkSign:
    url: https://github.com/rorkai/rork-sign.git
    from: 0.6.5
  ZipArchive:
    url: https://github.com/rorkai/swift-zip-archive.git
    exact: 0.8.1-rork.4
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  FeatherX:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - FeatherX
    dependencies:
      - package: RorkSign
        product: RorkSign
      - package: ZipArchive
        product: ZipArchive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.risinginvader.featherx
        PRODUCT_NAME: FeatherX
        INFOPLIST_KEY_CFBundleDisplayName: FeatherX
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
